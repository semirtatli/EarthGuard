spring:
  application:
    name: notification-service

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: earthquakeEvent:com.earthguard.notification.dto.EarthquakeEvent

  # Mail Configuration (Mock for now)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@earthguard.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

logging:
  level:
    com.earthguard: DEBUG
    org.springframework.kafka: INFO

    # EarthGuard Configuration
    earthguard:
      email:
        enabled: false  # Set to true to enable real email sending
      notification:
        default-recipients:
          - admin@earthguard.com
          - alerts@earthguard.com