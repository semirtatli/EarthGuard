spring:
  application:
    name: notification-service

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.earthguard.**"
        spring.json.type.mapping: earthquakeEvent:com.earthguard.notification.dto.EarthquakeEvent
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

  # Mail Configuration (Mock for now)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@earthguard.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082

logging:
  level:
    com.earthguard: ${LOG_LEVEL:INFO}
    org.springframework.kafka: INFO
    org.springframework.messaging: INFO

# EarthGuard Configuration
earthguard:
  email:
    enabled: false
  notification:
    default-recipients:
      - admin@earthguard.com
      - alerts@earthguard.com
  cors:
    allowed-origins:
      - http://localhost
      - http://localhost:3000
      - http://localhost:5173
      - https://*.earthguard.com
      - ${FRONTEND_URL:http://localhost:3000}
    max-age: 3600
