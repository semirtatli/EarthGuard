spring:
  application:
    name: earthquake-service

  datasource:
    url: jdbc:postgresql://localhost:5432/earthguard
    username: earthguard
    password: earthguard123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

logging:
  level:
    com.earthguard: DEBUG
    org.hibernate.SQL: DEBUG