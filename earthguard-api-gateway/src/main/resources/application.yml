spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Earthquake Service Routes
        - id: earthquake-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/earthquakes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 10      # tokens per second
                  burstCapacity: 20      # maximum burst size
                  requestedTokens: 1     # tokens per request
            - name: CircuitBreaker
              args:
                name: earthquakeServiceCircuitBreaker
                fallbackUri: forward:/fallback/earthquake-service

        # Notification Service Routes
        - id: notification-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 20
                  burstCapacity: 40
                  requestedTokens: 1

        # WebSocket Route (no rate limiting for WS)
        - id: websocket-service
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "https://*.earthguard.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.earthguard: DEBUG