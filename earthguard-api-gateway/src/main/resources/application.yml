spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Earthquake Service Routes
        - id: earthquake-service
          uri: ${EARTHQUAKE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/earthquakes/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 10      # tokens per second
                  burstCapacity: 20      # maximum burst size
                  requestedTokens: 1     # tokens per request
            - name: CircuitBreaker
              args:
                name: earthquakeServiceCircuitBreaker
                fallbackUri: forward:/fallback/earthquake-service

        # Auth Routes
        - id: auth-service
          uri: ${EARTHQUAKE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Preferences Routes
        - id: preferences-service
          uri: ${EARTHQUAKE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/preferences/**

        # Swagger Routes
        - id: swagger-ui
          uri: ${EARTHQUAKE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-ui/**,/api-docs/**,/v3/api-docs/**

        # Notification Service Routes
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: 20
                  burstCapacity: 40
                  requestedTokens: 1

        # WebSocket Route (no rate limiting for WS)
        - id: websocket-service
          uri: ${NOTIFICATION_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/ws/**

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "https://*.earthguard.com"
              - "${FRONTEND_URL:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL:INFO}
    com.earthguard: ${LOG_LEVEL:INFO}
