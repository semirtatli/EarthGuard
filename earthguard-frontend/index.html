<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarthGuard - Earthquake Monitoring</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav id="navbar">
        <div class="nav-brand">
            <span class="nav-logo">&#127757;</span>
            <span class="nav-title">EarthGuard</span>
        </div>
        <div class="nav-links">
            <a href="#" data-page="dashboard" class="nav-link active">Dashboard</a>
            <a href="#" data-page="preferences" class="nav-link auth-only" style="display:none;">Preferences</a>
        </div>
        <div class="nav-auth" id="nav-auth">
            <a href="#" data-page="login" class="nav-link" id="login-link">Login</a>
            <span id="user-info" style="display:none;">
                <span id="username-display"></span>
                <button id="logout-btn" class="btn btn-sm">Logout</button>
            </span>
        </div>
    </nav>

    <div id="toast-container"></div>

    <main id="app">
        <!-- Dashboard Page -->
        <div id="page-dashboard" class="page active">
            <div class="dashboard-grid">
                <div class="map-container">
                    <div id="map"></div>
                </div>
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h2>Recent Earthquakes</h2>
                        <div class="controls">
                            <select id="limit-select">
                                <option value="10">Last 10</option>
                                <option value="25">Last 25</option>
                                <option value="50">Last 50</option>
                            </select>
                            <button id="refresh-btn" class="btn btn-sm">Refresh</button>
                        </div>
                    </div>
                    <div class="stats-bar" id="stats-bar">
                        <div class="stat"><span id="stat-total">0</span> Total</div>
                        <div class="stat critical"><span id="stat-critical">0</span> Critical</div>
                    </div>
                    <div id="earthquake-list" class="earthquake-list">
                        <div class="loading">Loading earthquakes...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Login/Register Page -->
        <div id="page-login" class="page">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Login</button>
                    <button class="auth-tab" data-tab="register">Register</button>
                </div>
                <form id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <div id="login-error" class="error-msg"></div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>
                <form id="register-form" class="auth-form" style="display:none;">
                    <h2>Register</h2>
                    <div class="form-group">
                        <label for="reg-fullname">Full Name</label>
                        <input type="text" id="reg-fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" required minlength="6">
                    </div>
                    <div id="register-error" class="error-msg"></div>
                    <button type="submit" class="btn btn-primary btn-full">Register</button>
                </form>
            </div>
        </div>

        <!-- Preferences Page -->
        <div id="page-preferences" class="page">
            <div class="preferences-container">
                <h2>Notification Preferences</h2>
                <form id="preferences-form">
                    <fieldset>
                        <legend>Location</legend>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="pref-location">Location Name</label>
                                <input type="text" id="pref-location" placeholder="e.g. Istanbul">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="pref-lat">Latitude</label>
                                <input type="number" id="pref-lat" step="0.0001" min="-90" max="90">
                            </div>
                            <div class="form-group">
                                <label for="pref-lng">Longitude</label>
                                <input type="number" id="pref-lng" step="0.0001" min="-180" max="180">
                            </div>
                            <div class="form-group">
                                <label for="pref-radius">Radius (km)</label>
                                <input type="number" id="pref-radius" min="1" max="20000" value="100">
                            </div>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Alerts</legend>
                        <div class="form-group">
                            <label for="pref-min-mag">Minimum Magnitude</label>
                            <input type="number" id="pref-min-mag" step="0.1" min="0" max="10" value="4.0">
                        </div>
                        <div class="form-group checkbox-group">
                            <label><input type="checkbox" id="pref-email"> Email Notifications</label>
                            <label><input type="checkbox" id="pref-push" checked> Push Notifications</label>
                            <label><input type="checkbox" id="pref-critical"> Critical Only</label>
                        </div>
                    </fieldset>
                    <div id="pref-error" class="error-msg"></div>
                    <div id="pref-success" class="success-msg"></div>
                    <button type="submit" class="btn btn-primary">Save Preferences</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/preferences.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
